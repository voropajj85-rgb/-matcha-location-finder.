name: Phase 3B Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ingest/**'
      - '.github/workflows/phase3b-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        run: |
          node --check scripts/ingest/extract-listing-facts.js
          node --check scripts/ingest/enrich-listing.js
          node --check scripts/ingest/normalize-listing.js
          node --check scripts/ingest/run-ingestion.js

      - name: Existing ingestion tests
        id: legacy
        continue-on-error: true
        run: |
          node scripts/ingest/tests/ingestion.test.js > legacy-test.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat legacy-test.log

      - name: Phase 3B extraction tests
        id: phase3b
        continue-on-error: true
        run: |
          node scripts/ingest/tests/phase3b-extraction.test.js > phase3b-test.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat phase3b-test.log

      - name: Full dry-run validation
        id: dryrun
        continue-on-error: true
        run: |
          node scripts/ingest/run-ingestion.js --dry-run --validation-report > dry-run.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat dry-run.log

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-validation-artifacts
          path: |
            legacy-test.log
            phase3b-test.log
            dry-run.log
            scripts/ingest/reports/latest-validation.json
          if-no-files-found: warn

      - name: Enforce validation result
        if: always()
        run: |
          test "${{ steps.legacy.outputs.exit_code }}" = "0"
          test "${{ steps.phase3b.outputs.exit_code }}" = "0"
          test "${{ steps.dryrun.outputs.exit_code }}" = "0"
