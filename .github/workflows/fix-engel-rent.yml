name: Fix Engel Rent Per Sqm
on:
  push:
    branches: [fix/engel-rent-per-sqm]
    paths: ['.github/workflows/fix-engel-rent.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engel-rent-per-sqm
      - name: Patch broker rent parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/ingest/sources/brokers.js')
          s=p.read_text()
          s=s.replace('(?:gesamtmiete|nettokaltmiete|nettomiete|monatsmiete|miete|pacht)', '(?:gesamtmiete|monatsnettokaltmiete|nettokaltmiete|nettomiete|monatsmiete|miete|pacht)')
          s=s.replace('(?:nettokaltmiete|miete)\\s*\\/\\s*', '(?:monatsnettokaltmiete|nettokaltmiete|miete)\\s*\\/\\s*')
          p.write_text(s)
          PY
      - name: Regression test
        run: |
          node --check scripts/ingest/sources/brokers.js
          node - <<'NODE'
          const assert = require('assert');
          const { candidateFromBrokerPage, ADAPTERS } = require('./scripts/ingest/sources/brokers');
          const adapter = ADAPTERS.find(x => x.name === 'Engel & Völkers');
          const html = '<html><h1>Retail München</h1><body>Fläche 50 m² Monatsnettokaltmiete/m² 25 € Ladenfläche</body></html>';
          const c = candidateFromBrokerPage(adapter, 'https://www.engelvoelkers.com/de/de/exposes/test', html, new Date().toISOString());
          assert.strictEqual(c.rent, null);
          assert.strictEqual(c.rentPerSqm, 25);
          assert.strictEqual(c.rentType, 'per_sqm');
          console.log('Engel €/m² regression passed');
          NODE
          node scripts/ingest/tests/ingestion.test.js
      - name: Commit fix
        run: |
          git config user.name 'engel-rent-fixbot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-engel-rent.yml
          git add scripts/ingest/sources/brokers.js
          git commit -m 'fix: keep Engel per-sqm rent out of monthly rent'
          git push origin HEAD:fix/engel-rent-per-sqm
