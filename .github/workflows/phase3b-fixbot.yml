name: Phase 3B Fixbot

on:
  push:
    branches: [codex/phase3b-extraction-intelligence]
    paths:
      - '.github/workflows/phase3b-fixbot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase3b-extraction-intelligence

      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'target not found in {path}: {old[:80]}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'scripts/ingest/extract-listing-facts.js',
              "      const context = source.slice(Math.max(0, match.index - 50), Math.min(source.length, match.index + match[0].length + 50));\n      if (blocked.test(context)) continue;",
              "      const prefix = source.slice(Math.max(0, match.index - 60), match.index);\n      const labelled = /^(?:kaltmiete|nettokaltmiete|nettomiete|monatsmiete|mietpreis|miete|pacht)/i.test(match[0]);\n      if (!labelled && blocked.test(prefix)) continue;"
          )

          replace_once(
              'scripts/ingest/enrich-listing.js',
              "add(new RegExp(`(?<value>[0-9][0-9.,]*)\\\\s*(?:m²|qm|m2)\\\\s*${high}`, 'ig'), 'sales_area', 105);",
              "add(new RegExp(`(?<value>[0-9][0-9.,]*)\\\\s*(?:m²|qm|m2)\\\\s*${high}`, 'ig'), 'sales_area', 120);"
          )

          replace_once(
              'scripts/ingest/extract-listing-facts.js',
              "add(new RegExp(`(?<value>[0-9][0-9.,]*)\\\\s*(?:m²|qm|m2)\\\\s*${LABEL}`, 'ig'), 'sales_area', 105, 'area-before-label');",
              "add(new RegExp(`(?<value>[0-9][0-9.,]*)\\\\s*(?:m²|qm|m2)\\\\s*${LABEL}`, 'ig'), 'sales_area', 120, 'area-before-label');"
          )

          replace_once(
              'scripts/ingest/supabase-upsert.js',
              "    return {\n      known: Boolean(value.known),\n      value: value.value ?? null,\n      amount: value.amount ?? null\n    };",
              "    return {\n      ...value,\n      known: value.known != null ? Boolean(value.known) : value.status !== 'unknown',\n      value: value.value ?? value.evidence?.raw ?? null,\n      amount: value.amount ?? null\n    };"
          )

          replace_once(
              'scripts/ingest/supabase-upsert.js',
              "    nebenkosten: listing.nk ?? listing.nebenkosten?.value ?? null,",
              "    nebenkosten: listing.nk ?? listing.nebenkosten?.amount ?? (typeof listing.nebenkosten === 'number' ? listing.nebenkosten : null),"
          )
          PY

      - name: Run targeted tests
        run: |
          node --check scripts/ingest/extract-listing-facts.js
          node --check scripts/ingest/enrich-listing.js
          node --check scripts/ingest/normalize-listing.js
          node --check scripts/ingest/supabase-upsert.js
          node scripts/ingest/tests/ingestion.test.js
          node scripts/ingest/tests/phase3b-extraction.test.js

      - name: Commit fixes and remove fixbot
        run: |
          git config user.name 'phase3b-fixbot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/phase3b-fixbot.yml
          git add scripts/ingest/extract-listing-facts.js scripts/ingest/enrich-listing.js scripts/ingest/supabase-upsert.js
          git commit -m 'fix: harden Phase 3B extraction semantics'
          git push origin HEAD:codex/phase3b-extraction-intelligence
