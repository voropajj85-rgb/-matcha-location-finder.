name: Phase 3B Klein Fix

on:
  push:
    branches:
      - codex/phase3b-extraction-intelligence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase3b-extraction-intelligence
      - run: node scripts/ingest/patch-phase3b-klein.js
      - run: node --check scripts/ingest/extract-listing-facts.js
      - run: node scripts/ingest/tests/ingestion.test.js
      - run: node scripts/ingest/tests/phase3b-extraction.test.js
      - run: |
          git config user.name phase3b-klein-fixbot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/phase3b-klein-format-fix.yml scripts/ingest/patch-phase3b-klein.js
          git add scripts/ingest/extract-listing-facts.js scripts/ingest/tests/phase3b-extraction.test.js
          git commit -m "fix: parse Kleinanzeigen structured rent and area fields"
          git push origin HEAD:codex/phase3b-extraction-intelligence
