name: Ingest listings

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Optional source: kleinanzeigen, immowelt, immoscout24, stadt-muenchen, brokers"
        required: false
        type: string
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax checks
        run: |
          node --check scripts/check-listings.js
          node --check scripts/ingest/run-ingestion.js
          node --check scripts/ingest/normalize-listing.js
          node --check scripts/ingest/deduplicate-listings.js
          node --check scripts/ingest/verify-listings.js
          node --check scripts/ingest/supabase-upsert.js

      - name: Unit-like ingestion tests
        run: node scripts/ingest/tests/ingestion.test.js

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SOURCE_ARG=""
          if [ -n "${{ inputs.source }}" ]; then
            SOURCE_ARG="--source=${{ inputs.source }}"
          fi
          node scripts/ingest/run-ingestion.js $SOURCE_ARG
