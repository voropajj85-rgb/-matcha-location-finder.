name: Phase 3B Production Hardening Patch

on:
  push:
    branches:
      - codex/phase3b-production-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase3b-production-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hardening changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]}')
              p.write_text(s.replace(old, new, 1))

          replace('scripts/ingest/extract-listing-facts.js',
          """  if (relative) {\n    const vat = /zzgl\\.?\\s*(?:MwSt|USt)/i.test(relative) ? 'plus_vat' : (/inkl\\.?\\s*(?:MwSt|USt)/i.test(relative) ? 'incl_vat' : null);\n    return { amount: null, months: num(relative), status: 'known_relative', vat, evidence: ev(relative) };\n  }\n""",
          """  if (relative) {\n    const months = num(relative);\n    if (Number.isFinite(months) && months > 0 && months <= 12) {\n      const vat = /zzgl\\.?\\s*(?:MwSt|USt)/i.test(relative) ? 'plus_vat' : (/inkl\\.?\\s*(?:MwSt|USt)/i.test(relative) ? 'incl_vat' : null);\n      return { amount: null, months, status: 'known_relative', vat, evidence: ev(relative) };\n    }\n  }\n""")

          replace('scripts/ingest/normalize-listing.js',
          """    rent: candidate.rent ?? null,\n    rentType: candidate.rentType ?? null,\n""",
          """    rent: candidate.rent ?? null,\n    rentType: candidate.rentType ?? null,\n    rentPerSqm: candidate.rentPerSqm ?? null,\n""")

          replace('scripts/ingest/supabase-upsert.js',
          """    rent: listing.rent ?? null,\n    nebenkosten: listing.nk ?? listing.nebenkosten?.amount ?? (typeof listing.nebenkosten === 'number' ? listing.nebenkosten : null),\n""",
          """    rent: listing.rent ?? null,\n    rent_type: listing.rentType ?? null,\n    rent_per_sqm: listing.rentPerSqm ?? null,\n    nebenkosten: listing.nk ?? listing.nebenkosten?.amount ?? (typeof listing.nebenkosten === 'number' ? listing.nebenkosten : null),\n""")
          replace('scripts/ingest/supabase-upsert.js',
          """unit_area,project_total_area,rent,nebenkosten,provision""",
          """unit_area,project_total_area,rent,rent_type,rent_per_sqm,nebenkosten,provision""")

          replace('scripts/ingest/merge-existing-listing.js',
          """    rent: row.rent ?? row.price,\n    nk: row.nebenkosten,\n""",
          """    rent: row.rent ?? row.price,\n    rentType: row.rent_type ?? null,\n    rentPerSqm: row.rent_per_sqm ?? null,\n    nk: row.nebenkosten,\n""")
          replace('scripts/ingest/merge-existing-listing.js',
          """    rent: preferUseful(existing.rent, discovered.rent),\n    nk: preferUseful(existing.nk, discovered.nk ?? discovered.nebenkosten?.value),\n""",
          """    rent: (discovered.rentType === 'per_sqm' || discovered.priceStatus === 'request')\n      ? null\n      : preferUseful(existing.rent, discovered.rent),\n    rentType: preferUseful(existing.rentType, discovered.rentType),\n    rentPerSqm: preferUseful(existing.rentPerSqm, discovered.rentPerSqm),\n    nk: preferUseful(existing.nk, discovered.nk ?? discovered.nebenkosten?.value),\n""")

          p = Path('scripts/ingest/sources/brokers.js')
          s = p.read_text()
          old = "function extractLocation(text) {\n  const address = text.match(/(?:adresse|anschrift|lage)"
          if old not in s:
              raise SystemExit('extractLocation anchor not found')
          s = s.replace("function extractLocation(text) {\n", "function extractLocation(text) {\n  const navLocation = text.match(/\\bZurück\\s+(München|Penzberg)\\b/i)?.[1];\n  if (navLocation) return navLocation;\n", 1)
          s = s.replace("    district: 'München',\n", "    district: location,\n", 1)
          p.write_text(s)

          p = Path('scripts/ingest/tests/phase3b-extraction.test.js')
          s = p.read_text()
          marker = "  assert.strictEqual(extractProvision('provisionsfrei').status, 'free');\n"
          s = s.replace(marker, marker + "  assert.strictEqual(extractProvision('Verfügbar ab August 2026 Monatsmiete für Gesamtfläche 1.200 €').status, 'unknown');\n", 1)
          marker2 = "  assert.strictEqual(engelPerSqm.rentType, 'per_sqm');\n"
          addition = """  assert.strictEqual(engelPerSqm.rentType, 'per_sqm');\n\n  const penzberg = candidateFromBrokerPage(\n    { name: 'Colliers', sourceName: 'Colliers', sourceFamily: 'broker', sourceQuality: 'high' },\n    'https://www.colliers.de/gewerbeimmobilien/objekt/test-penzberg/',\n    '<h1>Schöne Einzelhandelsfläche in Bestlage von Penzberg</h1><p>Zurück Penzberg Fläche 60 m². Mietpreis ab auf Anfrage.</p>',\n    '2026-08-28T10:00:00.000Z'\n  );\n  assert.strictEqual(penzberg.address, 'Penzberg');\n  assert.strictEqual(penzberg.district, 'Penzberg');\n"""
          s = s.replace(marker2, addition, 1)
          p.write_text(s)

          Path('supabase/migrations/20260828_phase3b_rent_semantics.sql').parent.mkdir(parents=True, exist_ok=True)
          Path('supabase/migrations/20260828_phase3b_rent_semantics.sql').write_text("""alter table public.listings\n  add column if not exists rent_type text,\n  add column if not exists rent_per_sqm numeric;\n""")
          PY
      - name: Validate
        run: |
          node --check scripts/ingest/extract-listing-facts.js
          node --check scripts/ingest/normalize-listing.js
          node --check scripts/ingest/merge-existing-listing.js
          node --check scripts/ingest/supabase-upsert.js
          node --check scripts/ingest/sources/brokers.js
          node scripts/ingest/tests/phase3b-extraction.test.js
          node scripts/ingest/tests/ingestion.test.js
      - name: Commit changes and remove helper workflow
        run: |
          rm .github/workflows/phase3b-hardening-patch.yml
          git config user.name "phase3b-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Phase 3B production data semantics"
          git push origin codex/phase3b-production-hardening
