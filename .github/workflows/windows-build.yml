name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      - 'electron/**'
      - 'build/**'
      - 'package.json'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/workspace.json'
      - 'scripts/tests/workspace.test.js'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build Windows artifacts in Wine container
        run: |
          docker run --rm \
            -e CI=true \
            -e ELECTRON_CACHE=/root/.cache/electron \
            -e ELECTRON_BUILDER_CACHE=/root/.cache/electron-builder \
            -v "$PWD:/project" \
            -w /project \
            electronuserland/builder:wine \
            /bin/bash -lc "npm install --no-audit --no-fund && npm run check && npm run dist:win"
      - uses: actions/upload-artifact@v4
        with:
          name: matcha-bar-windows
          path: dist/*.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: matcha-bar-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
