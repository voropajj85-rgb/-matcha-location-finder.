name: Windows desktop build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'electron/**'
      - 'package.json'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/workspace.json'
      - 'scripts/tests/workspace.test.js'
      - '.github/workflows/windows-build.yml'
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      - 'electron/**'
      - 'package.json'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/workspace.json'
      - 'scripts/tests/workspace.test.js'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate workspace
        run: npm run check
      - name: Build Windows installer and portable app
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: matcha-bar-windows
          path: dist/*.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: matcha-bar-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
