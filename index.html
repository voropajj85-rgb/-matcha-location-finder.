<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173021">

  <title>Matcha Location Finder</title>

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <h1>🍵 Matcha Location Finder</h1>
          <p>München · помещение под Matcha Bar</p>
        </div>

        <button
          class="icon-button"
          type="button"
          aria-label="Открыть фильтры"
          data-open-sheet="filterSheet"
        >
          <span aria-hidden="true">☰</span>
        </button>
      </div>
    </header>

    <nav class="tabs" aria-label="Основные разделы" data-tabs>
      <button class="tab active" id="tabList" type="button" data-mode="list" aria-controls="listMode" aria-selected="true">
        Список
      </button>

      <button class="tab" id="tabMap" type="button" data-mode="map" aria-controls="mapMode" aria-selected="false">
        Карта
      </button>
    </nav>

    <section class="summary" aria-label="Сводка">
      <div class="stat">
        <strong id="sCount">0</strong>
        <span>кандидатов</span>
      </div>

      <div class="stat">
        <strong id="sAvg">—</strong>
        <span>direct</span>
      </div>

      <div class="stat">
        <strong id="sTop">—</strong>
        <span>лидов</span>
      </div>
    </section>

    <main>
      <section id="listMode" aria-labelledby="listHeading">
        <div class="section-heading">
          <h2 id="listHeading">Кандидаты</h2>
          <span id="listMeta">данные из репозитория</span>
        </div>

        <div id="list" class="list" aria-live="polite"></div>
      </section>

      <section id="mapMode" class="hidden" aria-labelledby="mapHeading">
        <div class="section-heading">
          <h2 id="mapHeading">Карта кандидатов</h2>
          <span>готово для координат</span>
        </div>

        <div id="mapContainer" class="map-container" aria-label="Карта объектов"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Нижняя навигация">
    <button class="nav-button active" type="button" data-mode="list" data-nav-mode="list">
      <strong>⌂</strong>
      Список
    </button>

    <button class="nav-button" type="button" data-mode="map" data-nav-mode="map">
      <strong>⌖</strong>
      Карта
    </button>

    <button class="nav-button" type="button" data-open-sheet="addSheet">
      <strong>＋</strong>
      Добавить
    </button>

    <button class="nav-button" type="button" data-open-sheet="filterSheet">
      <strong>⚙</strong>
      Фильтры
    </button>
  </nav>

  <div id="detailSheet" class="sheet-backdrop">
    <section class="sheet" aria-label="Подробности объекта">
      <div class="sheet-handle"></div>

      <button
        class="close-button"
        type="button"
        aria-label="Закрыть"
        data-close-sheet="detailSheet"
      >
        ×
      </button>

      <div id="detail" class="sheet-content"></div>
    </section>
  </div>

  <div id="filterSheet" class="sheet-backdrop">
    <section class="sheet filter-sheet" aria-label="Фильтры">
      <div class="sheet-handle"></div>

      <button
        class="close-button"
        type="button"
        aria-label="Закрыть"
        data-close-sheet="filterSheet"
      >
        ×
      </button>

      <h3>Фильтры</h3>

      <div class="two-columns">
        <div class="field">
          <label for="fMin">Мин. площадь</label>
          <input id="fMin" type="number" inputmode="numeric" min="0" placeholder="не указано">
        </div>

        <div class="field">
          <label for="fMax">Макс. площадь</label>
          <input id="fMax" type="number" inputmode="numeric" min="0" placeholder="не указано">
        </div>
      </div>

      <div class="field">
        <label for="fRent">Макс. аренда</label>
        <input id="fRent" type="number" inputmode="numeric" min="0" placeholder="по запросу">
      </div>

      <div class="field">
        <label for="fGastro">Gastronomie</label>
        <select id="fGastro">
          <option value="all">Любая</option>
          <option value="confirmed">Подтверждено</option>
          <option value="possible">Возможно</option>
          <option value="unknown">Нужно уточнить</option>
          <option value="no">Нельзя</option>
        </select>
      </div>

      <div class="two-columns">
        <div class="field">
          <label for="fSource">Источник</label>
          <select id="fSource">
            <option value="all">Все</option>
          </select>
        </div>

        <div class="field">
          <label for="fStatus">Статус</label>
          <select id="fStatus">
            <option value="all">Все</option>
          </select>
        </div>
      </div>

      <div class="sheet-actions">
        <button id="resetFilters" class="secondary-button" type="button">
          Сбросить
        </button>

        <button id="applyFilters" class="primary-button" type="button">
          Применить
        </button>
      </div>
    </section>
  </div>

  <div id="addSheet" class="sheet-backdrop">
    <section class="sheet" aria-label="Добавить объект">
      <div class="sheet-handle"></div>

      <button
        class="close-button"
        type="button"
        aria-label="Закрыть"
        data-close-sheet="addSheet"
      >
        ×
      </button>

      <h3>Добавить свой объект</h3>

      <div class="field">
        <label for="aDistrict">Район</label>
        <input id="aDistrict" type="text" placeholder="Например, Schwabing">
      </div>

      <div class="field">
        <label for="aAddress">Адрес</label>
        <input id="aAddress" type="text" placeholder="Улица, München">
      </div>

      <div class="two-columns">
        <div class="field">
          <label for="aArea">Площадь, м²</label>
          <input id="aArea" type="number">
        </div>

        <div class="field">
          <label for="aRent">Аренда, €</label>
          <input id="aRent" type="number">
        </div>
      </div>

      <div class="two-columns">
        <div class="field">
          <label for="aNk">Nebenkosten, €</label>
          <input id="aNk" type="number">
        </div>

        <div class="field">
          <label for="aGastro">Gastronomie</label>
          <select id="aGastro">
            <option value="check">Уточнить</option>
            <option value="yes">Подходит</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="aUrl">Ссылка</label>
        <input id="aUrl" type="url" placeholder="https://...">
      </div>

      <div class="field">
        <label for="aFees">Provision / Ablöse / Kaution</label>
        <input id="aFees" type="text" placeholder="уточнить">
      </div>

      <div class="field">
        <label for="aNote">Заметка</label>
        <textarea id="aNote" rows="4"></textarea>
      </div>

      <button id="saveListing" class="primary-button" type="button">
        Сохранить
      </button>
    </section>
  </div>

  <script type="module" src="./js/app.js?v=business-fit-2"></script>
</body>
</html>
