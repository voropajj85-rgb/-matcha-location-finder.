<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173021">

  <title>Matcha Location Finder</title>

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <h1>🍵 Matcha Location Finder</h1>
          <p>München · помещение под Matcha Bar</p>
        </div>

        <button
          class="icon-button"
          type="button"
          aria-label="Открыть фильтры"
          data-open-sheet="filterSheet"
        >
          ⚙️
        </button>
      </div>
    </header>

    <nav class="tabs" aria-label="Основные разделы">
      <button class="tab active" id="tabList" type="button" data-mode="list">
        Список
      </button>

      <button class="tab" id="tabDeals" type="button" data-mode="deals">
        💎 Выгода
      </button>

      <button class="tab" id="tabMap" type="button" data-mode="map">
        Карта
      </button>
    </nav>

    <section class="quick-filters" aria-label="Быстрые фильтры">
      <button class="quick-filter" type="button" data-preset="top">
        🔥 Только сильные
      </button>

      <button class="quick-filter" type="button" data-preset="budget">
        ≤ €3 000
      </button>
    </section>

    <section class="summary" aria-label="Сводка">
      <div class="stat">
        <strong id="sCount">0</strong>
        <span>кандидатов</span>
      </div>

      <div class="stat">
        <strong id="sAvg">—</strong>
        <span>ср. аренда</span>
      </div>

      <div class="stat">
        <strong id="sTop">—</strong>
        <span>лучший score</span>
      </div>
    </section>

    <main>
      <section id="listMode">
        <div class="section-heading">
          <h2>Кандидаты</h2>
          <span>данные из репозитория</span>
        </div>

        <div id="list" class="list"></div>
      </section>

      <section id="dealsMode" class="hidden">
        <div class="section-heading">
          <h2>💎 Выгодные условия</h2>
          <span>редкие преимущества</span>
        </div>

        <div id="dealsList" class="list"></div>
      </section>

      <section id="mapMode" class="hidden">
        <div class="section-heading">
          <h2>Карта кандидатов</h2>
          <span>следующий слой проекта</span>
        </div>

        <div class="map-placeholder" aria-label="Место для карты"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Нижняя навигация">
    <button class="nav-button active" type="button" data-mode="list" data-nav-mode="list">
      <strong>⌂</strong>
      Список
    </button>

    <button class="nav-button" type="button" data-mode="map" data-nav-mode="map">
      <strong>⌖</strong>
      Карта
    </button>

    <button class="nav-button" type="button" data-open-sheet="addSheet">
      <strong>＋</strong>
      Добавить
    </button>

    <button class="nav-button" type="button" data-open-sheet="filterSheet">
      <strong>⚙</strong>
      Фильтры
    </button>
  </nav>

  <div id="detailSheet" class="sheet-backdrop">
    <section class="sheet" aria-label="Подробности объекта">
      <div class="sheet-handle"></div>

      <button
        class="close-button"
        type="button"
        aria-label="Закрыть"
        data-close-sheet="detailSheet"
      >
        ×
      </button>

      <div id="detail"></div>
    </section>
  </div>

  <div id="filterSheet" class="sheet-backdrop">
    <section class="sheet" aria-label="Фильтры">
      <div class="sheet-handle"></div>

      <button
        class="close-button"
        type="button"
        aria-label="Закрыть"
        data-close-sheet="filterSheet"
      >
        ×
      </button>

      <h3>Фильтры</h3>

      <div class="two-columns">
        <div class="field">
          <label for="fMin">Мин. площадь</label>
          <input id="fMin" type="number" value="25">
        </div>

        <div class="field">
          <label for="fMax">Макс. площадь</label>
          <input id="fMax" type="number" value="90">
        </div>
      </div>

      <div class="field">
        <label for="fRent">Макс. аренда</label>
        <input id="fRent" type="number" value="3500">
      </div>

      <button id="applyFilters" class="primary-button" type="button">
        Применить
      </button>
    </section>
  </div>

  <div id="addSheet" class="sheet-backdrop">
    <section class="sheet" aria-label="Добавить объект">
      <div class="sheet-handle"></div>

      <button
        class="close-button"
        type="button"
        aria-label="Закрыть"
        data-close-sheet="addSheet"
      >
        ×
      </button>

      <h3>Добавить свой объект</h3>

      <div class="field">
        <label for="aDistrict">Район</label>
        <input id="aDistrict" type="text" placeholder="Например, Schwabing">
      </div>

      <div class="field">
        <label for="aAddress">Адрес</label>
        <input id="aAddress" type="text" placeholder="Улица, München">
      </div>

      <div class="two-columns">
        <div class="field">
          <label for="aArea">Площадь, м²</label>
          <input id="aArea" type="number">
        </div>

        <div class="field">
          <label for="aRent">Аренда, €</label>
          <input id="aRent" type="number">
        </div>
      </div>

      <div class="field">
        <label for="aUrl">Ссылка</label>
        <input id="aUrl" type="url" placeholder="https://...">
      </div>

      <div class="field">
        <label for="aNote">Заметка</label>
        <textarea id="aNote" rows="4"></textarea>
      </div>

      <button id="saveListing" class="primary-button" type="button">
        Сохранить
      </button>
    </section>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
